name: gopuca
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. Every other event, including
  # merge_group, runs everything.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest # only runs the paths filter, no checkout needed
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ github.event_name != 'pull_request' }}
      code: ${{ steps.filter-code.outputs.code }}
      armv7: ${{ steps.filter-armv7.outputs.armv7 }}
    steps:
      # A file counts as a code change only if none of the documentation
      # patterns matches it, so the "everything" pattern is needed too.
      - name: Detect changes beyond documentation
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter-code
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!logo/**'
              - '!gopher.png'

      - name: Detect changes to the code arm/v7 tests
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter-armv7
        with:
          # ua, uasc and the packages their tests import (go list -test -deps),
          # plus the files that decide how they are built and tested. The
          # armv7 job also needs the code filter, so ua/uadoc.md alone runs nothing.
          filters: |
            armv7:
              - 'ua/**'
              - 'uasc/**'
              - 'uacp/**'
              - 'uapolicy/**'
              - 'id/**'
              - 'errors/**'
              - 'debug/**'
              - 'tests/python/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/go.yml'

      - name: Write decisions to the run summary
        if: always()
        env:
          ALL: ${{ github.event_name != 'pull_request' }}
          CODE: ${{ steps.filter-code.outputs.code }}
          ARMV7: ${{ steps.filter-armv7.outputs.armv7 }}
        run: |
          {
            echo "### CI path filter"
            echo "- Run every job (not a pull request): ${ALL}"
            echo "- Pull request changes code, not only documentation: ${CODE:-filter did not run}"
            echo "- Pull request changes the code arm/v7 tests: ${ARMV7:-filter did not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test ${{ matrix.os }} go${{ matrix.go }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.all == 'true' || needs.detect-changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-windows-2025-4]
        go: ["1.23.x", "1.24.x"]

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          # Depot shares one cache across all branches of the repository, so a
          # pull request from a fork must not write a cache that main restores.
          cache: ${{ github.event_name != 'pull_request' }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.X"
          architecture: "x64"

      - name: Get dependencies
        run: |
          go mod download
          make install-py-opcua

      - name: Run Tests
        run: make test integration conformance

  # A field that needs 64-bit alignment, or an int that holds a wire value,
  # behaves differently on 32-bit and arm. v0.9.2 shipped a panic on 386
  # (#962) because CI only ran amd64.
  arch:
    name: Test ${{ matrix.name }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.all == 'true' || needs.detect-changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/386
            runner: depot-ubuntu-24.04
            target: test-386
          - name: linux/arm64
            runner: depot-ubuntu-24.04-arm
            target: test conformance

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.x"
          # Depot shares one cache across all branches of the repository, so a
          # pull request from a fork must not write a cache that main restores.
          cache: ${{ github.event_name != 'pull_request' }}

      - name: Run Tests
        run: make ${{ matrix.target }}

  # arm/v7 is the slowest job of the workflow, so it runs only when the code
  # it tests changes. A matrix leg cannot be skipped on its own, which is
  # why this is a job of its own instead of a leg of the arch matrix.
  armv7:
    name: Test linux/arm/v7 (ua, uasc)
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.all == 'true' ||
      (needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.armv7 == 'true')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.x"
          # Depot shares one cache across all branches of the repository, so a
          # pull request from a fork must not write a cache that main restores.
          cache: ${{ github.event_name != 'pull_request' }}

      # Graviton4 cannot run 32-bit arm code, so arm/v7 runs under QEMU.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm

      - name: Run Tests
        run: make test-armv7

  # The one required check for branch protection: lists every job that
  # blocks a merge and never skips.
  ci:
    name: CI
    if: always()
    needs: [detect-changes, test, arch, armv7]
    runs-on: ubuntu-latest # only reads the results of the jobs above
    timeout-minutes: 5
    steps:
      - name: Fail if a job that should have run did not succeed
        env:
          CHANGES: ${{ needs.detect-changes.result }}
          RUN_ALL: ${{ needs.detect-changes.outputs.all }}
          RUN_CODE: ${{ needs.detect-changes.outputs.code }}
          RUN_ARMV7: ${{ needs.detect-changes.outputs.armv7 }}
          TEST: ${{ needs.test.result }}
          ARCH: ${{ needs.arch.result }}
          ARMV7: ${{ needs.armv7.result }}
        run: |
          fail=0

          # The decisions of the filter are needed to know what should have
          # run, so a failed filter is a failed run.
          [ "$CHANGES" = success ] || fail=1

          # On a pull request each decision must be true or false. An empty
          # one, from a renamed output or a skipped filter step, would
          # otherwise skip every job and pass.
          if [ "$RUN_ALL" != true ]; then
            for decision in "$RUN_CODE" "$RUN_ARMV7"; do
              case "$decision" in
                true | false) ;;
                *) fail=1 ;;
              esac
            done
          fi

          # No job may fail or be cancelled, whatever the filter decided.
          for result in "$TEST" "$ARCH" "$ARMV7"; do
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done

          # A skipped job is only accepted where the filter said to skip it.
          if [ "$RUN_ALL" = true ] || [ "$RUN_CODE" = true ]; then
            [ "$TEST" = success ] || fail=1
            [ "$ARCH" = success ] || fail=1
          fi
          if [ "$RUN_ALL" = true ] || { [ "$RUN_CODE" = true ] && [ "$RUN_ARMV7" = true ]; }; then
            [ "$ARMV7" = success ] || fail=1
          fi

          exit "$fail"
